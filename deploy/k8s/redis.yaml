# Redis: the connection registry, live connector status, the command bus and the BootNotification
# budget. One replica with its own disk (a StatefulSet), the same pinned image as docker-compose.yml.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: voltline
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: voltline
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: voltline
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: voltline
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: voltline
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: voltline
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: voltline
    spec:
      containers:
        - name: redis
          image: redis:8.10.3-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi
