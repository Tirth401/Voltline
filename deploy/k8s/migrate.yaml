# Applies the database migrations and the demo seed, once per `pnpm kind:up`, before the services
# start. The migrator takes an advisory lock (D-012), so it would also be safe from several pods.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: voltline
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: voltline
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: voltline
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: voltline:dev
          imagePullPolicy: Never
          args:
            - sh
            - -c
            - node packages/db/src/cli.ts migrate && node packages/db/src/cli.ts seed-demo
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
