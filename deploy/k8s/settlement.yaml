# Settlement (D-034): one pass every minute. The pass is a single idempotent SQL statement, safe to
# run anywhere and even twice at once, so a CronJob is all it needs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: settlement
  namespace: voltline
  labels:
    app.kubernetes.io/name: settlement
    app.kubernetes.io/part-of: voltline
spec:
  schedule: '* * * * *'
  # Not needed for correctness (two passes at once are safe), only to stop slow passes piling up.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: settlement
            app.kubernetes.io/part-of: voltline
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: settlement
              image: voltline:dev
              imagePullPolicy: Never
              args: ['node', 'services/settlement/src/main.ts', '--once']
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ['ALL']
