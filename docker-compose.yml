# Local dependencies for development and integration tests.
# Images are pinned to exact versions so every machine runs the same database (DECISIONS.md D-015).
name: voltline

services:
  postgres:
    image: timescale/timescaledb:2.31.0-pg17
    command: ['postgres', '-c', 'timescaledb.telemetry_level=off']
    environment:
      POSTGRES_USER: voltline
      POSTGRES_PASSWORD: voltline
      POSTGRES_DB: voltline
    ports:
      - '${VOLTLINE_PG_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voltline -d voltline']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    ports:
      - '${VOLTLINE_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
